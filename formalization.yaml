version: "v1.0"

project:
  name: "The Erdős–Simonovits degeneracy conjecture fails at every level"
  authors: ["Claude Fable 5", "Claude Opus 5"]
  license: "Apache-2.0"
  date: "2026-08-01"

status:
  scope: >-
    Complete, sorry-free Lean 4 + mathlib formalization of all results:
    counterexamples to Erdős problem #146 at r=3 and at every r >= 2, the
    asymptotic window law with sharp threshold at Gibbs weight e, and the
    exponent law 8 r^2 eps_r(beta_theta) -> 1 - theta across the feasible
    window (1/16 at the midpoint; supremal constant 1/8).
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  sorries: 0  # in all proof targets; the challenge statement file (lake build Challenge) intentionally contains one
  main_results:
    - name: "Theorem 1: H of degeneracy exactly 3 with ex(n;H) >= c n^(5/3 + 1/160), exponent and exactness literal (past the paper certificate 1/200; hand-certified 1/4000 assembly retained in Theorem1.lean)"
      decl: "RDegenerateGraphsTarget.threeDegenerateExtremalCounterexample_sharp"
      file: "Theorem2.lean"
    - name: "Theorem 2: for every r >= 2, H_r of degeneracy exactly r with ex(n;H_r) >= c n^(2 - 1/r + 1/(28 r^2)) (optimized near-edge ledger theta=eta=1/100; beats the paper's 1/(107 r^2))"
      decl: "RDegenerateGraphsTarget.rDegenerateExtremalCounterexample_exact"
      file: "Theorem2.lean"
    - name: "Theorem 3(a): r^2 (C_r - A_r) -> lambda^4 ln^3(2)/64 for every subcritical lambda (lambda ln 2 < 1)"
      decl: "DegeneracyLaw.width_tendsto_unconditional_full"
      file: "Theorem3a.lean"
    - name: "Theorem 3(a) sharpness: r^2 width -> -infinity for lambda > 1/ln 2 (weight e)"
      decl: "DegeneracyLawSuper.threshold_sharp"
      file: "Prop63.lean"
    - name: "Theorem 3(b): 8 r^2 eps_r^max(beta_theta) -> 1 - theta for the whole in-window family (midpoint theta = 1/2 gives 16 r^2 eps -> 1; supremal constant 1/8 as theta -> 0)"
      decl: "DegeneracyLawB.eight_rsq_epsMax_theta_tendsto"
      file: "lib/LedgerAsym.lean"
    - name: "Degeneracy lower bound: the layered pattern is not (r-1)-degenerate (two-layer witness)"
      decl: "ExactDegeneracy.not_isDegenerate_of_layer_witness"
      file: "lib/ExactDegeneracy.lean"
  future_work:
    - "Per-r interval width evaluation at small r (would push 1/(28 r^2) toward ~1/(21 r^2), eps_3 toward 1/138, and the 1/(108 r^2) midpoint checkpoint to the paper's 1/(107 r^2))"

build: "lake build"
challenge: "K_ThreeDegenerateGraphs.lean"
