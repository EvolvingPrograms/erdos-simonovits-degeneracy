version: "v1.1"

project:
  name: "The Erdős–Simonovits degeneracy conjecture fails at every level"
  authors: ["Claude Fable 5", "Claude Opus 5"]
  license: "Apache-2.0"
  date: "2026-08-01"

status:
  scope: >-
    Complete, sorry-free Lean 4 + mathlib formalization of all results:
    counterexamples to Erdős problem #146 at r=3 and at every r >= 2, with
    degeneracy pinned exactly (IsDegenerate r AND not IsDegenerate (r-1));
    the asymptotic window law with sharp threshold at Gibbs weight e; the
    exponent family law 8 r^2 eps_r(beta_theta) -> 1 - theta across the
    feasible window (1/16 at the midpoint; supremal constant 1/8); and the
    explicit constants 1/(28 r^2) (all r >= 2) and 1/160 (r = 3), both
    strictly improving the midpoint evaluation of the same chain
    (kept as the 1/(108 r^2) checkpoint).
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  sorries: 0  # in all proof targets; the four frozen challenge statement files in challenges/ intentionally contain one each
  main_results:
    - name: "Theorem 1: H of degeneracy exactly 3 with ex(n;H) >= c n^(5/3 + 1/160), exponent and exactness literal"
      decl: "ThreeDegenerateGraphsTarget.threeDegenerateExtremalCounterexample_sharp"
      file: "Theorem1.lean"
    - name: "Theorem 2: for every r >= 2, H_r of degeneracy exactly r with ex(n;H_r) >= c n^(2 - 1/r + 1/(28 r^2)) (near-edge ledger theta=eta=1/100)"
      decl: "RDegenerateGraphsTarget.rDegenerateExtremalCounterexample_exact"
      file: "Theorem2.lean"
    - name: "Theorem 3(a): r^2 (C_r - A_r) -> lambda^4 ln^3(2)/64 for every subcritical lambda (lambda ln 2 < 1)"
      decl: "DegeneracyLaw.width_tendsto_unconditional_full"
      file: "Theorem3a.lean"
    - name: "Theorem 3(a) sharpness: r^2 width -> -infinity for lambda > 1/ln 2 (weight e)"
      decl: "DegeneracyLawSuper.threshold_sharp"
      file: "Prop63.lean"
    - name: "Theorem 3(b): 8 r^2 eps_r^max(beta_theta) -> 1 - theta for the whole in-window family (midpoint theta = 1/2 gives 16 r^2 eps -> 1; supremal constant 1/8 as theta -> 0)"
      decl: "DegeneracyLawB.eight_rsq_epsMax_theta_tendsto"
      file: "Theorem3b.lean"
  supporting_results:
    - name: "eps^max is antitone in beta on the window (so the supremal constant sits at the exclusion edge)"
      decl: "DegeneracyLawB.epsMaxR_anti"
      file: "lib/LedgerAsym.lean"
    - name: "Degeneracy lower bound: the layered pattern is not (r-1)-degenerate (two-layer minimum-degree witness, base >= r+1)"
      decl: "ExactDegeneracy.not_isDegenerate_of_layer_witness"
      file: "lib/ExactDegeneracy.lean"
    - name: "Quantified Lemma B: sup G_r attained at the center for every subcritical lambda once r >= R(lambda) (discharges Theorem 3(a) on the full range)"
      decl: "DegeneracyLawQuant.supG_eq_center_quant"
      file: "lib/CenterMaxThreshold.lean"
    - name: "(theta, eta)-parametric ledger: eps >= (1-eta)(1-theta) w / (K1 r^2)"
      decl: "DegeneracyLedgerSharp.epsR_theta_lower"
      file: "lib/LedgerSharp.lean"
    - name: "Theorem 2's constant: eps >= 1/(28 r^2) at theta = eta = 1/100 (r-aware K1(1/100) <= 0.1637)"
      decl: "DegeneracyLedgerSharp.eps_hundredth_28"
      file: "lib/LedgerSharp.lean"
    - name: "Theorem 1's constant: eps_3 >= 1/160 at r = 3 (Lemma C window bound specialized to r = 3)"
      decl: "DegeneracyLedgerSharp.eps_three_160"
      file: "lib/LedgerSharp.lean"
    - name: "The midpoint chain retained as a checkpoint: eps >= 1/(108 r^2) at theta = eta = 1/2"
      decl: "DegeneracyLedgerSharp.eps_half_108"
      file: "lib/LedgerSharp.lean"
    - name: "Compatibility form at the previous constant 1/(110 r^2)"
      decl: "RDegenerateGraphsTarget.rDegenerateExtremalCounterexample_explicit_110"
      file: "Theorem2.lean"
    - name: "Hand-certified r = 3 assembly at the original gain 1/4000 (retained; superseded by the sharp form)"
      decl: "ThreeDegenerateGraphsTarget.threeDegenerateExtremalCounterexample_exact"
      file: "Theorem1.lean"
  future_work:
    - "Per-r interval width evaluation at small r (would push 1/(28 r^2) toward ~1/(21 r^2), eps_3 toward 1/138, and the 1/(108 r^2) midpoint checkpoint to 1/(107 r^2))"

verification:
  # The CI workflow is the canonical verification script: run its steps
  # locally after cloning (lake exe cache get first, to fetch the mathlib
  # cache the way lean-action does).
  ci: ".github/workflows/build.yml"
  # Optional extra, not in CI: the leanprover/comparator judge (needs
  # comparator, lean4export at the project toolchain, and landrun in PATH;
  # reviewer notes in challenges/NOTES_FOR_REVIEWER.md). All four pass.
  comparator: "for c in challenges/challenge*.json; do lake env comparator $c; done"
