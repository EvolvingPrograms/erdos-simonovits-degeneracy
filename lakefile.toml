name = "erdos-simonovits-degeneracy"
version = "1.0.0"
keywords = ["math"]
defaultTargets = ["Upstream", "ErdosDegeneracyLib", "ErdosDegeneracyScratch", "ErdosDegeneracy", "ErdosDegeneracyTests"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

# OpenAI's own Lean file for chapter 10 of [OAI26], vendored verbatim
# (Apache-2.0; see NOTICE).
[[lean_lib]]
name = "Upstream"
srcDir = "proofs/lib"
roots = ["CompactnessAndDegeneracy"]

[[lean_lib]]
name = "ErdosDegeneracyLib"
srcDir = "proofs/lib"
roots = ["LawDefs", "Sampling3", "SamplingR", "KernelR", "BridgeR", "ProfilesR", "LedgerR", "EntropyConcavity", "WindowLowerBound", "WindowUpperBound", "WindowUpper", "BernsteinStrip", "CenterMaxThreshold", "WindowLimit", "LedgerTuned", "LedgerAsym", "AssemblySched", "AssemblySchedHost", "SuperCritical", "ExactDegeneracy", "LedgerSharp", "WindowSharp", "AssemblyR"]

[[lean_lib]]
name = "ErdosDegeneracy"
srcDir = "proofs"
roots = ["Lemma41", "Lemma42", "Lemma44", "Theorem12", "Theorem12r3", "Theorem13a", "Theorem13b", "Corollary14"]

[[lean_lib]]
# The independent, from-scratch r = 3 route: hand-certified numerics that
# import none of the general-r analytic machinery.  Kept as a second,
# independent confirmation of the r = 3 case.
name = "ErdosDegeneracyScratch"
srcDir = "proofs/scratch"
roots = ["Entropy3", "Kernel3", "Bridge3", "Assembly3"]

[[lean_lib]]
name = "ErdosDegeneracyTests"
srcDir = "tests"
roots = ["KernelRCheck3"]

[[lean_lib]]
name = "ChallengeFaithful"
srcDir = "tests"
roots = ["ChallengeFaithful"]

# Comparator specifications and solutions are grouped by mathematical topic.
# Kept out of defaultTargets because Challenge modules contain intentional sorry.
[[lean_lib]]
name = "Comparison"
srcDir = "challenges"
roots = [
  "AllR.Definitions", "AllR.Challenge", "AllR.Solution",
  "ThreeDegenerate.Definitions", "ThreeDegenerate.Challenge", "ThreeDegenerate.Solution",
  "WindowLaw.Definitions", "WindowLaw.Challenge", "WindowLaw.Solution",
  "FamilyLaw.Definitions", "FamilyLaw.Challenge", "FamilyLaw.Solution",
]
