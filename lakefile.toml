name = "erdos-simonovits-degeneracy"
version = "1.0.0"
keywords = ["math"]
defaultTargets = ["Upstream", "ErdosDegeneracyLib", "ErdosDegeneracy", "ErdosDegeneracyTests"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "Upstream"
srcDir = "lib"
roots = ["CompactnessAndDegeneracy"]

[[lean_lib]]
name = "ErdosDegeneracyLib"
srcDir = "lib"
roots = ["LawDefs", "Entropy3", "Sampling3", "Kernel3", "Bridge3", "SamplingR", "KernelR", "BridgeR", "ProfilesR", "LedgerR", "EntropyConcavity", "WindowLowerBound", "WindowUpperBound", "BernsteinStrip", "CenterMaxThreshold", "WindowLimit", "LedgerTuned", "LedgerAsym", "SuperCritical", "ExactDegeneracy", "LedgerSharp", "Assembly3", "AssemblyR"]

[[lean_lib]]
name = "ErdosDegeneracy"
srcDir = "."
roots = ["LemmaA", "Lemma61", "LemmaC", "LemmaB", "Theorem1", "Theorem2", "Theorem3a", "Theorem3b", "Prop63"]

[[lean_lib]]
name = "ErdosDegeneracyTests"
srcDir = "tests"
roots = ["KernelRCheck3"]

[[lean_lib]]
name = "ChallengeFaithful"
srcDir = "tests"
roots = ["ChallengeFaithful"]

# --- Comparator challenge/solution pairs (see comparator-configs/) ---------
# Frozen statement files (each ends in an intentional `sorry`) live in
# challenges/; the solutions restate them verbatim and prove them.

[[lean_lib]]
name = "K_ThreeDegenerateGraphs"
srcDir = "challenges"
roots = ["K_ThreeDegenerateGraphs"]

[[lean_lib]]
name = "K_RDegenerateGraphs"
srcDir = "challenges"
roots = ["K_RDegenerateGraphs"]

[[lean_lib]]
name = "K_WindowLaw"
srcDir = "challenges"
roots = ["K_WindowLaw"]

[[lean_lib]]
name = "K_FamilyLaw"
srcDir = "challenges"
roots = ["K_FamilyLaw"]

[[lean_lib]]
name = "Solution1"
srcDir = "."
roots = ["Solution1"]

[[lean_lib]]
name = "Solution2"
srcDir = "."
roots = ["Solution2"]

[[lean_lib]]
name = "Solution3"
srcDir = "."
roots = ["Solution3"]

[[lean_lib]]
name = "Solution4"
srcDir = "."
roots = ["Solution4"]
